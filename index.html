<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quit Tracker v2.1 (AI engines)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--g:rgba(30,41,59,.6);--ln:rgba(148,163,184,.24);--tx:#F1F5F9;--mu:#94A3B8;--em:#10B981;--em2:#34D399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 40% at 50% 0,rgba(16,185,129,.16),transparent 60%),var(--bg);color:var(--tx);font:500 15px/1.45 Manrope,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 18px 120px}[hidden]{display:none!important}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font:800 24px Manrope,system-ui,sans-serif;margin:0}h2{font:800 16px Manrope,system-ui,sans-serif;margin:0 0 10px}
.sub{color:var(--mu);font-size:12.5px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.g{background:var(--g);border:1px solid var(--ln);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.grid .g{margin:0;display:flex;flex-direction:column;gap:12px}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.vl{font:800 26px/1.1 Manrope,system-ui,sans-serif}.lb{font-weight:600;font-size:13px;color:var(--mu)}.cp{font-size:12px;color:var(--mu);margin-top:3px}
.ring{position:relative;width:min(288px,100%);aspect-ratio:1;margin:0 auto 18px}.ring svg{width:100%;height:100%}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mb{font:700 10px Manrope,system-ui,sans-serif;letter-spacing:.07em;color:#6EE7B7;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.32);border-radius:99px;padding:5px 10px;text-align:center}
.cd{display:flex;gap:5px;align-items:flex-start}.cd div{text-align:center}.cd b{display:block;font:800 clamp(26px,9vw,34px)/1 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}.cd small{font-size:10px;color:var(--mu);letter-spacing:.1em;font-weight:600}.cd i{font:800 28px/1 Manrope;color:var(--em);opacity:.7;font-style:normal}
button{font:inherit;cursor:pointer;color:var(--tx)}
.btn{width:100%;min-height:48px;border-radius:16px;border:1px solid var(--ln);background:transparent;font-weight:700;margin-top:8px}
.em{background:var(--em);border-color:var(--em);color:#04281E}
.cta{width:100%;min-height:68px;border:0;border-radius:20px;background:linear-gradient(135deg,#F59E0B,#F97316);color:#1A1203;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:inset 0 0 0 1px rgba(253,186,116,.55),0 10px 30px rgba(249,115,22,.45),0 0 60px rgba(245,158,11,.28);text-align:left;margin-bottom:10px}
.cta b{display:block;font-size:15px;letter-spacing:.02em}.cta small{display:block;font-weight:700;font-size:12px;opacity:.8}
.ghost{width:100%;min-height:44px;background:none;border:0;color:var(--mu);font-weight:600;font-size:13.5px;margin-bottom:12px}
details summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}summary::-webkit-details-marker{display:none}details[open] .chev{transform:rotate(180deg)}
#log{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.msg{padding:10px 13px;font-size:14px;max-width:88%;overflow-wrap:anywhere}.msg p{margin:0 0 6px}.msg ul{margin:0 0 6px;padding-left:18px}.msg>:last-child{margin:0}
.msg.u{align-self:flex-end;background:var(--em);color:#04281E;border-radius:16px 16px 4px 16px;font-weight:600}.msg.a{align-self:flex-start;background:rgba(51,65,85,.7);border-radius:16px 16px 16px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -14px 0;padding:0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600;font-size:13px;background:rgba(51,65,85,.6);border:1px solid var(--ln);border-radius:99px;padding:0 14px;min-height:44px}
input,select{font:inherit;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--ln);background:rgba(15,23,42,.6);color:var(--tx);padding:0 12px}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send{width:44px;min-height:44px;border-radius:50%;border:0;background:var(--em);color:#04281E;display:grid;place-items:center;padding:0;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(15,23,42,.95);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:480px;margin:0 auto}nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mu);font:600 10.5px Manrope,system-ui,sans-serif;min-height:48px;padding:2px 0}
nav span{padding:4px 16px;border-radius:99px;display:grid;place-items:center}nav [aria-current]{color:var(--em2)}nav [aria-current] span{background:rgba(16,185,129,.16)}
.step{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}.step:first-of-type{border:0}.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.step.on .dot{background:var(--em);border-color:var(--em);color:#04281E}.step.done .dot{border-color:var(--em);color:var(--em2)}.step.done{opacity:.65}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}.bars i{flex:1;background:var(--em);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bd{text-align:center;opacity:.4}.bd.on{opacity:1}.bd b{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--ln);font-size:15px}.bd.on b{background:var(--em);border:2px solid var(--em);color:#04281E}.bd span{font-size:12px;display:block}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:#F1F5F9;color:#0F172A;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:90vw;text-align:center}
textarea{width:100%;font:12px monospace;border-radius:12px;border:1px solid var(--ln);background:rgba(15,23,42,.6);color:var(--tx);padding:10px;margin-top:8px}
.n{font-size:12px;color:var(--mu)}
</style></head><body>
<div id="app"><main id="v-home"></main><main id="v-plan" hidden></main><main id="v-hist" hidden></main><main id="v-ach" hidden></main><main id="v-me" hidden></main></div>
<nav aria-label="Main"><div id="nav"></div></nav>
<div id="crave" class="ov" role="dialog" aria-modal="true" aria-label="Craving timer" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),DAY=864e5,H=36e5,K="qt2";
let S=null;try{S=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
S=S||{};S.last=S.last||Date.now();S.hist=S.hist||[];S.use=S.use||{};S.urges=S.urges||0;
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const P2=n=>String(n).padStart(2,"0"),kf=t=>{const d=new Date(t);return d.getFullYear()+"-"+P2(d.getMonth()+1)+"-"+P2(d.getDate())},dk=()=>kf(Date.now());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=t=>new Date(t).toLocaleDateString([],{month:"short",day:"numeric"});
const dur=ms=>{const h=Math.floor(ms/H),d=Math.floor(h/24);return d?d+"d "+h%24+"h":h+"h "+Math.floor(ms%H/6e4)+"m"};
const IC={dollar:'<path d="M12 2v20"/><path d="M17 6.5C16 5 14.5 4.5 12 4.5c-2.8 0-4.5 1.3-4.5 3.2 0 4.6 9 2.2 9 7 0 2-1.8 3.3-4.5 3.3-2.5 0-4.2-.7-5.3-2.3"/>',flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3-1.6-5-3.2-6.8C14.7 6.9 14 5 14 2c-3 1.5-5.5 4.2-5.8 7.6-.7-.8-1.1-1.8-1.7-2.6C5.5 9 5 11 5 15c0 4.2 3 7 7 7z"/>',shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',home:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',plan:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',bolt:'<path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>',chev:'<path d="M6 9l6 6 6-6"/>',send:'<path d="M12 19V5M5 12l7-7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',coffee:'<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v2M12 3v2"/>',pill:'<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/>',spark:'<path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3z"/>'};
const ic=(n,s=20,c="currentColor")=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const MS=[[1/24,"1 HOUR","1h"],[.25,"6 HOURS","6h"],[.5,"12 HOURS","12h"],[1,"1 DAY","1d"],[2,"2 DAYS","2d"],[3,"3 DAYS","3d"],[7,"7 DAYS","1w"],[14,"14 DAYS","2w"],[30,"30 DAYS","1m"],[90,"90 DAYS","3m"],[180,"180 DAYS","6m"],[365,"1 YEAR","1y"]];
const UN={cig:"cigarettes per day",vape:"pods per day",pouch:"pouches per day",patch:"mg"};
function steps(a,p){const r=x=>x>=10?Math.round(x):Math.round(x*2)/2,o=[a];let c=a;while(c>0){let n=r(c*(1-p));if(n>=c)n=c-(c>=2?1:.5);if(n<=Math.max(.5,a*.1))n=0;o.push(n);c=n}return o}
function plan(){const t=S.tp;if(!t)return null;const o=steps(t.a,t.p/100),i=Math.min(o.length-1,Math.max(0,Math.floor((Date.now()-t.s)/(t.d*DAY))));return{t,o,i,v:o[i],n:o.length-1}}
const cur=()=>(S.sp&&S.sp.c)||"$";
const fmtM=n=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
// Money saved = daily spend x time since the quit start date (live), adjusted for a taper plan or logged uses
function saved(){
  const a=S.sp&&S.sp.a;if(!(a>0))return 0;
  const q=qdTs()||S.last,now=Date.now();if(now<=q)return 0;
  const P=plan();let s=0;
  if(P&&P.t.k==="day"&&P.t.a>0){
    let t=q;
    while(t<now){const e=new Date(t);e.setHours(24,0,0,0);const t1=Math.min(now,e.getTime());
      const i=Math.min(P.n,Math.max(0,Math.floor((t-P.t.s)/(P.t.d*DAY))));
      s+=a*(t1-t)/DAY*(1-P.o[i]/P.t.a);t=t1}
  }else{
    s=a*(now-q)/DAY;
    const pr=(S.prod&&S.prod.price)||0,qk=kf(q);let u=0;for(const k in S.use)if(k>=qk)u+=S.use[k];
    s-=u*pr;
  }
  return Math.max(0,s);
}
function moneyCap(){const a=S.sp&&S.sp.a;if(!(a>0))return "add your daily spend";if(!S.qd)return "add a quit start date";const P=plan();return (P&&P.t.k==="day"?"vs baseline, since ":"since ")+fd(qdTs())}
const best=()=>Math.max(Date.now()-S.last,...S.hist.map(x=>x.end-x.start));
let tt=0;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},3500)}
const card=(i,c,t,v,s)=>`<div class="g"><div class="row"><div class="ic" style="background:${c}2a;color:${c}">${ic(i)}</div><span class="lb">${t}</span></div><div><div class="vl">${v}</div><div class="cp">${s}</div></div></div>`;

// ---- v2.1 helpers: products, currency, quit date ----
const PN={cig:"Cigarettes",vape:"Vape (pods)",pouch:"Pouches",patch:"Patch (mg)",custom:"Other / custom product"};
const pname=p=>p&&p.type?(p.type==="custom"?(p.name||"Custom product"):PN[p.type]):"";
const prodUI=(x,p)=>`<label for="${x}t">What do you use?</label><select id="${x}t">${Object.keys(PN).map(k=>`<option value="${k}" ${p.type===k?"selected":""}>${PN[k]}</option>`).join("")}</select><div id="${x}w" ${p.type==="custom"?"":"hidden"}><div class="two"><div><label for="${x}n">Product name</label><input id="${x}n" maxlength="30" placeholder="e.g. snus, nicotine gum" value="${esc(p.name||"")}"></div><div><label for="${x}u">Counted in</label><input id="${x}u" maxlength="20" placeholder="pieces" value="${esc(p.unit||"")}"></div></div></div>`;
const CUR=["$","₱","€","£","¥","₹","₩"];
const curUI=(id,v)=>{const k=!v||CUR.includes(v);return `<select id="${id}">${CUR.map(c=>`<option ${c===(v||"$")?"selected":""}>${c}</option>`).join("")}<option value="_" ${k?"":"selected"}>Other</option></select><input id="${id}x" maxlength="3" placeholder="Symbol" aria-label="Other currency symbol" value="${k?"":esc(v)}" style="margin-top:6px" ${k?"hidden":""}>`};
const curVal=id=>{const v=$(id).value;return v==="_"?($(id+"x").value.trim()||"$"):v};
const qdTs=()=>{if(!S.qd)return 0;const t=new Date(S.qd.length>10?S.qd:S.qd+"T00:00:00").getTime();return t>0?t:0};
const lnow=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const qdv=()=>!S.qd?"":(S.qd.length>10?S.qd.slice(0,16):S.qd+"T00:00");
const qs0=()=>{const d=new Date(qdTs()||Date.now());d.setHours(0,0,0,0);return d.getTime()};
function qday(){const q=qdTs();if(!q)return 0;const a=new Date(q),t=new Date();a.setHours(0,0,0,0);t.setHours(0,0,0,0);const n=Math.round((t-a)/DAY)+1;return n>0?n:0}
const qtxt=()=>{const q=qdTs();if(!q)return "Set the date and time you started quitting. Your dashboard fills in from it.";const sl=S.hist.length&&S.hist[0].end>q;return (qday()?"Day "+qday()+" of your quit journey. ":"Your quit journey starts on "+fd(q)+". ")+(sl?"Your timer counts from your last logged slip.":"")};
function applyQd(v){const ts=v?new Date(v).getTime():0;if(!(ts>0))return;if(ts>Date.now()+6e4){toast("Pick a start that has already happened");return}S.qd=v;S.last=Math.max(ts,S.hist.length?S.hist[0].end:0);if(S.tp)S.tp.s=qs0();sv();$("qdn").textContent=qtxt();tick()}
function saveProd(){S.prod=Object.assign(S.prod||{},{type:$("mt").value,name:$("mn").value.trim(),unit:$("mu").value.trim()});sv()}
// ---- Home ----
$("v-home").innerHTML=`<div class="hd"><div class="row"><div class="ic" style="background:rgba(16,185,129,.16);color:#34D399">${ic("shield")}</div><div><b style="font:800 17px Manrope">Quit Tracker</b><div class="sub" style="color:#34D399;font-weight:700;letter-spacing:.08em">VERSION 2.1</div></div></div><div class="mb" id="qdl" hidden></div></div>
<button id="setup" class="btn em" data-a="go" data-t="plan" style="margin:0 0 14px">Add your quit start date and daily spend</button>
<div class="ring"><svg viewBox="0 0 288 288" role="img" aria-label="Milestone progress"><circle cx="144" cy="144" r="128" fill="none" stroke="rgba(148,163,184,.14)" stroke-width="14"/><circle id="rp" cx="144" cy="144" r="128" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 804" transform="rotate(-90 144 144)" style="filter:drop-shadow(0 0 10px rgba(16,185,129,.65))"/></svg>
<div class="rc"><div class="mb" id="mb"></div><div class="cd" id="cd"></div><div class="sub" id="since"></div></div></div>
<div class="grid" id="cards"></div>
<button class="cta" data-a="crave">${ic("bolt",24)}<span><b>I HAVE A CRAVING NOW!</b><small>(5-MIN TIMER)</small></span></button>
<button class="ghost" id="slip" data-a="slip">I used nicotine</button>
<details class="g" id="coach" open><summary><div class="ic" style="background:linear-gradient(135deg,#10B981,#0EA5E9);color:#06241B">${ic("spark")}</div><div class="sp"><b>AI Support Coach</b><div class="cp" style="margin:0">Knows your timer and plan</div></div><span class="chev">${ic("chev",20,"#94A3B8")}</span></summary>
<div id="log"><div class="msg a">Hi, I'm here for cravings, withdrawal or any question. What's on your mind?</div></div>
<div class="chips"><button class="chip" data-a="chip" data-l="Help me now" data-q="I need help right now. I'm having a strong craving. What can I do in the next few minutes?">${ic("bolt",16,"#FBBF24")}Help me now</button><button class="chip" data-a="chip" data-l="Triggers?" data-q="What are common triggers like coffee, and how do I handle them?">${ic("coffee",16,"#FDBA74")}Triggers?</button><button class="chip" data-a="chip" data-l="Replacement Guide" data-q="Explain nicotine replacement options (patch, gum, lozenge) and how to use them safely.">${ic("pill",16,"#38BDF8")}Replacement Guide</button></div>
<div class="row" style="margin-top:12px"><input id="qi" maxlength="400" placeholder="Ask your coach anything" aria-label="Ask your coach anything" autocomplete="off"><button class="send" data-a="send" aria-label="Send message">${ic("send",20)}</button></div>
<button class="ghost" id="aset" data-a="go" data-t="me" style="margin:8px 0 0;min-height:40px"></button></details>`;
function tick(){
  const ms=Math.max(0,Date.now()-S.last),t=Math.floor(ms/1e3),days=ms/DAY,m=MS.find(x=>x[0]>days)||MS[MS.length-1],pct=Math.min(100,Math.floor(days/m[0]*100));
  $("cd").innerHTML=[[Math.floor(t/86400),"DAYS"],[P2(Math.floor(t%86400/3600)),"HRS"],[P2(Math.floor(t%3600/60)),"MIN"],[P2(t%60),"SEC"]].map((x,i)=>(i?"<i>:</i>":"")+`<div><b>${P2(x[0])}</b><small>${x[1]}</small></div>`).join("");
  $("mb").textContent=`MILESTONE: ${m[1]} (${pct}% COMPLETE)`;$("rp").setAttribute("stroke-dasharray",(804.25*pct/100)+" 805");
  $("since").textContent="Nicotine-free since "+fd(S.last);{const q=qday();$("qdl").hidden=!q;$("qdl").textContent="QUIT DAY "+q}aiLbl();
  const b=best(),P=plan();$("setup").hidden=!!(S.qd&&S.sp&&S.sp.a>0);
  $("cards").innerHTML=card("dollar","#34D399","Money Saved",cur()+fmtM(saved()),moneyCap())+card("flame","#FBBF24","Longest Streak",b>=DAY?Math.floor(b/DAY)+" days":Math.floor(b/H)+" hrs","best so far")+card("shield","#38BDF8","Urges Beaten",S.urges,"urges resisted so far")+(P?card("layers","#A78BFA","Taper Step",P.t.u==="mg"?P.v+"mg":P.v,`step ${P.i+1}/${P.n}`):card("layers","#A78BFA","Quit Journey",qday()?"Day "+qday():"None",qday()?"since "+fd(qdTs()):"set a start date"));
}
